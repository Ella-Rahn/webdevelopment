<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Date</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .box {
            background-color: orange;
            padding: 40px 60px;
            border-radius: 15px;
            text-align: center;

        }

        .title {
            font-size: 28px;
            margin-bottom: 20px;
            color: coral;
        }

        .countdown {
            font-size: 30px;
            font-weight: bold;
            color: coral;
            margin-top: 20px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="box">
    <div class="title">Days Until a Century of Life:</div>

    <input type="date" id="birthday">
    <br>
    <button onclick="calculate()">Calculate</button>

    <div id="countdown" class="countdown"></div>
</div>

<script>
    function calculate() {
        let input = document.getElementById("birthday").value;

        if (!input) {
            document.getElementById("countdown").textContent = "Please enter your birthday.";
            return;
        }

        let birthDate = new Date(input);

        // Add 100 years
        let then = new Date(birthDate);
        then.setFullYear(then.getFullYear() + 100);

        function updateCountdown() {
            let now = new Date();
            let diff = then - now;

            if (diff <= 0) {
                document.getElementById("countdown").textContent = "You made it to 100! 🎉";
                return;
            }

            let seconds = Math.floor(diff / 1000) % 60;
            let minutes = Math.floor(diff / (1000 * 60)) % 60;
            let hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
            let days = Math.floor(diff / (1000 * 60 * 60 * 24)) % 365;
            let years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365));

            document.getElementById("countdown").textContent =
                `${years} years, ${days} days, ${hours}h ${minutes}m ${seconds}s`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    }
</script>

</body>
</html>
