<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Date</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .box {
            background-color: orange;
            padding: 40px 60px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .title {
            font-size: 28px;
            margin-bottom: 20px;
            color: coral;
        }

        .countdown {
            font-size: 40px;
            font-weight: bold;
            color: coral;
        }
    </style>
</head>

<body>

<div class="box">
    <div class="title">Days Until a Century of Life:</div>
    <div id="countdown" class="countdown"></div>
</div>

<script>
    let now = new Date();
    let then = new Date("7/17/2109 00:00:00");

    let diff = then - now;

    let seconds = Math.floor(diff / 1000) % 60;
    let minutes = Math.floor(diff / (1000 * 60)) % 60;
    let hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
    let days = Math.floor(diff / (1000 * 60 * 60 * 24)) % 365;
    let years= Math.floor(diff / (1000 * 60 * 60 * 24 * 365));

    document.getElementById("countdown").textContent =
        `${years} years, ${days} days, ${hours}h ${minutes}m ${seconds}s`;
</script>

</body>
</html>
