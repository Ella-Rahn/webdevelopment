<!DOCTYPE html>
<html>
<head>
    <title>Fruit Nutrition</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        #card {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 15px;
            width: 300px;
            display: none;
        }
    </style>
</head>
<body>

<h1>Fruit Facts</h1>

<select id="fruitSelect">
    <option value="">Select a fruit</option>
</select>

<div id="card">
    <h2 id="name"></h2>

    <p><b>Family:</b> <span id="family"></span></p>
    <p><b>Order:</b> <span id="order"></span></p>
    <p><b>Genus:</b> <span id="genus"></span></p>

    <hr>

    <p><b>Calories:</b> <span id="calories"></span></p>
    <p><b>Fat:</b> <span id="fat"></span> g</p>
    <p><b>Sugar:</b> <span id="sugar"></span> g</p>
    <p><b>Carbohydrates:</b> <span id="carbs"></span> g</p>
    <p><b>Protein:</b> <span id="protein"></span> g</p>
</div>

<script>
    const fruits = [
        {
            name: "Banana",
            family: "Musaceae",
            order: "Zingiberales",
            genus: "Musa",
            nutritions: {
                calories: 96,
                fat: 0.2,
                sugar: 17.2,
                carbohydrates: 22,
                protein: 1
            }
        },
        {
            name: "Apple",
            family: "Rosaceae",
            order: "Rosales",
            genus: "Malus",
            nutritions: {
                calories: 52,
                fat: 0.4,
                sugar: 10.3,
                carbohydrates: 11.4,
                protein: 0.3
            }
        },
        {
            name: "Orange",
            family: "Rutaceae",
            order: "Sapindales",
            genus: "Citrus",
            nutritions: {
                calories: 43,
                fat: 0.2,
                sugar: 8.2,
                carbohydrates: 8.3,
                protein: 1
            }
        },
        {
            name: "Watermelon",
            family: "Cucurbitaceae",
            order: "Cucurbitales",
            genus: "Citrullus",
            nutritions: {
                calories: 30,
                fat: 0.2,
                sugar: 6,
                carbohydrates: 8,
                protein: 0.6
            }
        },
        {
            name: "Mango",
            family: "Anacardiaceae",
            order: "Sapindales",
            genus: "Mangifera",
            nutritions: {
                calories: 60,
                fat: 0.38,
                sugar: 13.7,
                carbohydrates: 15,
                protein: 0.82
            }
        },
        {
            name: "Strawberry",
            family: "Rosaceae",
            order: "Rosales",
            genus: "Fragaria",
            nutritions: {
                calories: 29,
                fat: 0.4,
                sugar: 5.4,
                carbohydrates: 5.5,
                protein: 0.8
            }
        },
        {
            name: "Pineapple",
            family: "Bromeliaceae",
            order: "Poales",
            genus: "Ananas",
            nutritions: {
                calories: 50,
                fat: 0.12,
                sugar: 9.85,
                carbohydrates: 13.12,
                protein: 0.54
            }
        },
        {
            name: "Kiwi",
            family: "Actinidiaceae",
            order: "Struthioniformes",
            genus: "Apteryx",
            nutritions: {
                calories: 61,
                fat: 0.5,
                sugar: 9,
                carbohydrates: 15,
                protein: 1.1
            }
        }
    ];

    const select = document.getElementById("fruitSelect");

    fruits.forEach(fruit => {
        const option = document.createElement("option");
        option.value = fruit.name;
        option.textContent = fruit.name;
        select.appendChild(option);
    });

    select.addEventListener("change", () => {
        const fruit = fruits.find(f => f.name === select.value);

        if (!fruit) return;

        document.getElementById("name").textContent = fruit.name;
        document.getElementById("family").textContent = fruit.family;
        document.getElementById("order").textContent = fruit.order;
        document.getElementById("genus").textContent = fruit.genus;

        document.getElementById("calories").textContent = fruit.nutritions.calories;
        document.getElementById("fat").textContent = fruit.nutritions.fat;
        document.getElementById("sugar").textContent = fruit.nutritions.sugar;
        document.getElementById("carbs").textContent = fruit.nutritions.carbohydrates;
        document.getElementById("protein").textContent = fruit.nutritions.protein;

        document.getElementById("card").style.display = "block";
    });
</script>

</body>
</html>
